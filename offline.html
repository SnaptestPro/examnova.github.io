<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — EXAMNOVA</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0b1437, #1e3a8a); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', Segoe UI, Roboto, sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .card { max-width: 380px; }
  .icon { font-size: 3.2rem; margin-bottom: 12px; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; }
  p { color: #cbd5e1; font-size: .95rem; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #1e1b4b; border: none;
    padding: 12px 28px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Internet connection nahi mila</h1>
    <p>Lagta hai aap offline hain aur yeh app pehli baar khul rahi hai (isliye kuch bhi local save nahi hai). Internet connect hote hi dobara try karein.</p>
    <button onclick="location.reload()">🔄 Dobara Try Karein</button>
  </div>
</body>
</html>
