<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EXAMNOVA — Owner App Install</title>
<meta name="description" content="EXAMNOVA Owner Panel ko apne home screen par ek alag app ki tarah install karein." />

<!-- ══════════════════════════════════════════════════════════════════
     OWNER APP — separate installable PWA
     ----------------------------------------------------------------
     Ye page jaan-boojh kar index.html se ALAG rakha gaya hai, kyunki
     ek hi HTML document mein do <link rel="manifest"> ek saath kaam
     nahi karte — browser sirf EK manifest ko "is page ka installable
     app" maanta hai. Isliye Owner ke liye ek chhota, alag "install
     landing" page banaya gaya hai jo sirf OWNER wala manifest
     (manifest-owner.webmanifest) link karta hai.

     Is page ka apna native "Install" prompt milega (Chrome/Edge/
     Android etc. par), jo home screen/desktop par EXAMNOVA se BILKUL
     ALAG ek doosra app-icon banata hai ("EXAMNOVA Owner"). Us icon ko
     tap karne par seedha /?owner=1 khulta hai (manifest ke start_url
     ki wajah se) — Owner Panel turant, bina Admin Panel se login kiye.

     Student/Admin install abhi bhi index.html se hi hota hai (wahi
     manifest.webmanifest), bilkul pehle jaisa — is file se uska koi
     lena-dena nahi.
     ══════════════════════════════════════════════════════════════════ -->

<link rel="manifest" href="/manifest-owner.webmanifest" />
<link rel="icon" href="icon-192-owner.png" type="image/png" />

<!-- iOS: in tags ke bina "Add to Home Screen" sirf plain bookmark
     banata hai. In tags ke saath proper standalone app ki tarah
     khulta hai, apna alag icon/title ke saath (index.html se alag). -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="EXAMNOVA Owner" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-192-owner.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512-owner.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#78550a" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    padding: 28px 24px;
    box-shadow: 0 12px 40px rgba(120, 85, 10, .18);
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #b48214, #78550a);
    color: #fff;
    font-weight: 700;
    font-size: .72rem;
    letter-spacing: .06em;
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 14px;
  }
  .logo-img {
    width: 68px;
    height: 68px;
    border-radius: 16px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 1.25rem;
    color: #451a03;
    margin: 0 0 8px;
  }
  p {
    color: #57534e;
    font-size: .9rem;
    line-height: 1.55;
    margin: 0 0 18px;
  }
  #install-btn {
    background: linear-gradient(135deg, #b48214, #78550a);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-bottom: 12px;
  }
  #install-btn:disabled { opacity: .65; cursor: default; }
  #status-text {
    font-size: .82rem;
    color: #7c5a10;
    background: #fef3c7;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.5;
    display: none;
  }
  #status-text.show { display: block; }
  .skip-link {
    display: inline-block;
    color: #78550a;
    font-size: .85rem;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }
  .back-link {
    display: block;
    margin-top: 16px;
    color: #a8a29e;
    font-size: .78rem;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="card">
  <span class="badge">🏢 OWNER ONLY</span>
  <br />
  <img src="icon-192-owner.png" alt="EXAMNOVA Owner" class="logo-img" />
  <h1>EXAMNOVA Owner App</h1>
  <p>
    Ye alag app hai — sirf product/institutes ke Owner ke liye. Install
    karne ke baad home screen par ek naya icon banega ("EXAMNOVA Owner"),
    jo seedha Owner login par khulega. Admin Panel se login karne ki
    zaroorat nahi.
  </p>

  <button id="install-btn" type="button" disabled>⏳ Taiyaar ho raha hai…</button>
  <div id="status-text"></div>

  <button type="button" class="skip-link" onclick="window.location.href='/?owner=1'">
    Bina install kiye, seedha Owner Panel kholein →
  </button>

  <a class="back-link" href="/">← EXAMNOVA (Admin/Student) par wapas jaayein</a>
</div>

<script>
  function isStandaloneMode() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
  }

  // iOS "Add to Home Screen" ka apna manifest-support nahi hai — wahan
  // installed icon hamesha ISI page (owner-app.html) ko relaunch karta
  // hai, "start_url" ko nahi maanta. Isliye agar hum already standalone
  // mode mein hain (matlab home-screen icon se hi khula hai), turant
  // seedha Owner Panel par bhej dete hain — user ko ye landing page
  // dobara dikhne ki zaroorat nahi.
  if (isStandaloneMode()) {
    window.location.replace('/?owner=1');
  }

  let deferredPrompt = null;

  function detectPlatformInstructions() {
    const ua = window.navigator.userAgent || '';
    const isIos = /iphone|ipad|ipod/i.test(ua);
    const isAndroid = /android/i.test(ua);
    const isFirefox = /firefox|fxios/i.test(ua);
    const isSafari = /safari/i.test(ua) && !/crios|fxios|chrome|android|edg/i.test(ua);

    if (isIos) return 'Neeche Share button ⬆️ par tap karein, phir "Add to Home Screen" chunein.';
    if (isAndroid && isFirefox) return 'Upar-daayein 3-dot menu kholein aur "Install" ya "Add to Home screen" chunein.';
    if (!isAndroid && !isIos && isFirefox) return 'Firefox is page ko app ki tarah install support nahi karta. Chrome ya Edge mein kholein.';
    if (!isAndroid && !isIos && isSafari) return 'Menu bar mein File → "Add to Dock" chunein (Safari 17+), ya Chrome/Edge mein kholein.';
    return 'Address bar ke daayein taraf install icon ⊕ par click karein, ya browser ke 3-dot menu mein "Install App" dhoondein. Agar pehle se install ho chuka hai, to home screen/app list mein "EXAMNOVA Owner" dhoondh kar seedha usi se kholein.';
  }

  function couldGetNativePrompt() {
    const ua = window.navigator.userAgent || '';
    const isIos = /iphone|ipad|ipod/i.test(ua);
    const isFirefox = /firefox|fxios/i.test(ua);
    const isSafari = /safari/i.test(ua) && !/crios|fxios|chrome|android|edg/i.test(ua);
    return !isIos && !isFirefox && !isSafari;
  }

  const btn = document.getElementById('install-btn');
  const statusEl = document.getElementById('status-text');

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.classList.add('show');
  }

  function setFallbackReady() {
    btn.textContent = '👍 Samajh Gaya';
    btn.disabled = false;
    showStatus(detectPlatformInstructions());
    btn.onclick = function () { btn.textContent = '👍 Samajh Gaya'; };
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    btn.textContent = '⬇️ Owner App Install Karein';
    btn.disabled = false;
    statusEl.classList.remove('show');
    btn.onclick = function () {
      btn.disabled = true;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
      });
    };
  });

  window.addEventListener('appinstalled', function () {
    btn.textContent = '✅ Install Ho Gaya';
    btn.disabled = true;
    showStatus('EXAMNOVA Owner ab home screen par hai. Wahan se icon tap karke seedha Owner Panel khulega.');
  });

  document.addEventListener('DOMContentLoaded', function () {
    if (isStandaloneMode()) return; // already redirected above
    if (couldGetNativePrompt()) {
      setTimeout(function () {
        if (deferredPrompt) return; // beforeinstallprompt already handled it
        setFallbackReady();
      }, 3000);
    } else {
      setFallbackReady();
    }
  });

  // Same service worker/scope as the main app — registering it here
  // too so installability criteria are met even if this is the very
  // first page someone opens on the site.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
</script>
</body>
</html>
